# 单包工程：pnpm v11 settings 家用配置文件
# overrides 强制全依赖树（含 tsdown 嵌套）统一使用与 tsdown 0.8.0 兼容的 rolldown
packages: []
allowBuilds:
  # electron 42 起不带 postinstall，二进制由根 package.json 的 postinstall 补跑 install.js 下载并解压；
  # 这里仍放行，避免以后恢复 postinstall 时被 pnpm 拦掉。
  electron: true
  # electron-builder 的 Squirrel 目标依赖；我们只出 portable / nsis，不跑它的构建脚本
  electron-winstaller: false
minimumReleaseAgeExclude:
  - openai@7.39.0
overrides:
  rolldown: 1.0.0-beta.7
