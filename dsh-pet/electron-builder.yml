# electron-builder 配置 —— 把「单进程桌宠」打成双击可运行的 Windows 应用。
#
# 关键取舍：
#   1. 不带 node_modules：`lib/app.js` 已把 zod 打进来，其余外部只有 `electron` 与两个
#      永不执行的动态 import（@electron/get、@electron-internal/extract-zip，见 tsdown.config.mjs）。
#   2. electronDist 指向 node_modules/electron/dist（pnpm install 时下载好的那份），由 scripts/dist.mjs 注入，
#      避免每次打包都从 GitHub 重新下一套 110 MB —— 这台机器 github.com 不通。
#   3. asar 打开：素材（webm 51 MB）留在包内由主进程 fs 读取；没有原生模块需要 unpack。
appId: com.pc2005.dsh-pet
productName: dsh-pet
copyright: dsh-pet contributors

directories:
  output: dist-app

files:
  - lib/**
  - runtime/**
  # 素材只带运行时要用的四类：动画（webm）、字体、表情包、头像；
  # `assets/preview` 是 README 的 GIF（64 MB），不随包发布，这里排除。
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/config.jsonc
  - assets/logo.png
  - package.json
  - '!node_modules/**'

asar: true
npmRebuild: false

# 命令行（dsh-pet say / look / hook …）放在 asar 外面：它由系统 node 直接执行，读不了 asar。
# 装好后软链到 ~/.local/bin/dsh-pet；Claude Code hook 也调它。
extraResources:
  - from: scripts/pet-cli.mjs
    to: pet-cli.mjs

# electronVersion 不再写死：electron 已在 devDependencies，electron-builder 会自己读。
# electronDist 由 scripts/dist.mjs 经 `--config.electronDist=<解压目录>` 传入：
# 这个字段不做 ${env.*} 宏展开（实测会原样当成路径），所以不能写死在 YAML 里。

# 只保留中文和英文语言包。mac 是 *.lproj、Windows 是 locales/*.pak，两套命名都列上
# （electron-builder 会把值转小写后按完整名或前缀匹配）。
electronLanguages:
  - en
  - en-US
  - zh_CN
  - zh-CN

# 只出「解包目录」一种形态：分发时把 win-unpacked 整个压成 zip 即可（绿色版）。
# 不做 portable（每次启动自解压，慢）也不做 nsis（安装包对自用场景没有增量价值）——
# 真要回归安装包，把 target 改回 [nsis] 并补回 nsis 段（向导/快捷方式/卸载登记）即可。
win:
  icon: assets/logo.png
  target:
    - dir

# macOS：同样只出解包形态（dist-app/mac-arm64/dsh-pet.app），自用、不公证。
#   identity "-"：ad-hoc 签名。Apple Silicon 要求可执行代码带有效签名，改名/改 Info.plist 后必须重签；
#                  没有开发者证书时 ad-hoc 是唯一选择。ad-hoc 的指定要求默认是 cdhash（每次打包都变），
#                  屏幕录制等系统授权会随之失效，所以 scripts/dist.mjs 打完后把外层 .app 重签成
#                  「只认 bundle id」的指定要求，授权一次即可跨版本保留。
#   hardenedRuntime false：它只为公证服务；ad-hoc 签名下开着它会因库校验（Electron Framework 不同签名）启动失败。
#   LSUIElement：纯菜单栏应用，启动时不在 Dock 闪一下（helper 的 app.dock.hide() 要等 ready 才生效）。
#   NSLocalNetworkUsageDescription：局域网串门要发广播、连邻居，macOS 15 起要主人允许「本地网络」，弹框里显示这句。
#   icon：logo.png 只有 256px，electron-builder 要求 ≥512，由 scripts/dist.mjs 放大后经 --config.mac.icon 传入。
mac:
  target:
    - dir
  category: public.app-category.entertainment
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSLocalNetworkUsageDescription: 局域网串门：发现同一网络里的其他桌宠，带你的宠物去别人家做客。
